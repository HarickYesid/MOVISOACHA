<ion-header class="ion-no-border">
  <ion-toolbar style="--background: #1976d2; color: white;">
    <div style="padding: 10px 16px 5px 16px; display: flex; justify-content: space-between; align-items: center;">
      <h1 style="margin: 0; font-size: 1.4rem; font-weight: bold; color: white;">RutaSoacha</h1>
      <ion-avatar style="width: 36px; height: 36px; cursor: pointer;">
        <img src="assets/icon/favicon.png" alt="Perfil" onerror="this.src='https://ionicframework.com/docs/img/demos/avatar.ionic.png'" />
      </ion-avatar>
    </div>

    <!-- Buscador Integrado -->
    <div style="padding: 0 16px 12px 16px; cursor: pointer;" routerLink="/buscar-ruta">
      <ion-searchbar 
        placeholder="¿A dónde quieres ir?" 
        disabled="true"
        style="--background: #ffffff; --color: #333; --placeholder-color: #888; --icon-color: #666; --border-radius: 25px; padding: 0; height: 42px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
      </ion-searchbar>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding" style="position: relative;">

  <!-- Contenedor del Mapa Leaflet (Fondo garantizado) -->
  <div id="mapaUsuario" style="width: 100%; height: 100%; min-height: 100vh; position: absolute; top: 0; left: 0; z-index: 0;"></div>

  <!-- Botón Flotante de Mi Ubicación (FAB) -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" style="margin-bottom: 70px; z-index: 999;">
    <ion-fab-button color="light" size="small" (click)="centrarMapa()" style="box-shadow: 0 4px 10px rgba(0,0,0,0.25);">
      <ion-icon name="locate-outline" color="dark"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- 🤖 Botón Flotante de MoviBot (Chat IA) -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" style="margin-bottom: 135px; z-index: 999;">
    <ion-fab-button (click)="irAlChat()" style="--background: #1976d2; --color: white; --box-shadow: 0 4px 16px rgba(25, 118, 210, 0.6); --border-radius: 50%;">
      <ion-icon name="chatbubbles-outline" style="font-size: 24px;"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>

<!-- Barra Inferior de Navegación (Tabs) -->
<ion-footer class="ion-no-border" style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; background: transparent;">
  <div style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 20px 20px 0 0; display: flex; justify-content: space-around; align-items: center; padding: 8px 0; box-shadow: 0 -4px 16px rgba(0,0,0,0.15); border-top: 1px solid rgba(0,0,0,0.05);">
    
    <div style="text-align: center; color: #1976d2; cursor: pointer; flex: 1;">
      <ion-icon name="home" style="font-size: 22px; display: block; margin: 0 auto;"></ion-icon>
      <span style="font-size: 0.75rem; font-weight: 600;">Inicio</span>
    </div>

    <div routerLink="/rutas-usuario" style="text-align: center; color: #757575; cursor: pointer; flex: 1;">
      <ion-icon name="map-outline" style="font-size: 22px; display: block; margin: 0 auto;"></ion-icon>
      <span style="font-size: 0.75rem; font-weight: 500;">Rutas</span>
    </div>


  </div>
</ion-footer>
